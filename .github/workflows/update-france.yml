name: Update France Gas Stations

on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  update-france:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and process France gas stations
        run: python scripts/update_france.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add france_gasolineras.json
          git diff --staged --quiet || git commit -m "data: update France gas stations $(date -u +%Y-%m-%d)"
          git push
